<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="Watch the Impulse Automotive customer journey, from first look to first enquiry." />
    <title>The Impulse experience — Impulse Automotive</title>
    <style>
      @font-face {
        font-family: Manrope;
        src: url("/showcase/manrope-400.woff2") format("woff2");
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: Manrope;
        src: url("/showcase/manrope-700.woff2") format("woff2");
        font-style: normal;
        font-weight: 700;
        font-display: swap;
      }
      :root {
        color-scheme: dark;
        font-family: Manrope, Arial, sans-serif;
        color: #f5f4ee;
        background: #111111;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      .page { width: min(1160px, calc(100% - 80px)); margin-inline: auto; }
      .brand { display: inline-flex; flex-direction: column; gap: 2px; padding-block: 32px; }
      .brand-name { font-size: 19px; font-weight: 700; letter-spacing: .09em; }
      .brand-line { color: #b9b8b1; font-size: 9px; letter-spacing: .27em; }
      main { padding-block: 42px 56px; }
      .intro { margin-bottom: 30px; }
      .eyebrow { margin: 0 0 14px; color: #edcf54; font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(32px, 4.5vw, 52px); line-height: 1.15; font-weight: 700; letter-spacing: -.045em; }
      .description { margin: 16px 0 0; color: #b9b8b1; font-size: 16px; line-height: 1.6; }
      .player { margin: 0; }
      video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; border: 1px solid #353530; border-radius: 12px; background: #080808; object-fit: contain; }
      .player-caption { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 22px; margin-top: 22px; }
      .format { display: flex; align-items: center; gap: 13px; margin: 0; color: #b9b8b1; font-size: 12px; line-height: 1.6; }
      .format span + span::before { display: inline-block; width: 3px; height: 3px; margin-right: 13px; background: #73736c; border-radius: 50%; vertical-align: middle; content: ""; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; }
      .button { display: inline-flex; align-items: center; justify-content: center; gap: 25px; min-height: 46px; padding: 12px 18px; border: 1px solid #edcf54; border-radius: 5px; background: #edcf54; color: #111111; font-size: 12px; font-weight: 700; line-height: 1.5; text-decoration: none; transition: background-color .15s ease, border-color .15s ease; }
      .button:hover { background: #f5dc75; border-color: #f5dc75; }
      .button-secondary { border-color: #44443e; background: transparent; color: #f5f4ee; }
      .button-secondary:hover { border-color: #77776e; background: #22221f; }
      .button svg { width: 15px; height: 15px; flex-shrink: 0; }
      :focus-visible { outline: 3px solid #edcf54; outline-offset: 5px; }
      footer { padding-block: 24px 32px; border-top: 1px solid #30302b; }
      footer p { margin: 0; color: #97978e; font-size: 11px; line-height: 1.6; }
      @media (max-width: 650px) {
        .page { width: calc(100% - 36px); }
        .brand { padding-block: 25px; }
        main { padding-block: 28px 38px; }
        .intro { margin-bottom: 23px; }
        .description { font-size: 14px; }
        video { border-radius: 8px; }
        .player-caption { align-items: flex-start; gap: 19px; }
        .actions { width: 100%; }
        .button { flex: 1; gap: 16px; padding-inline: 14px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .button { transition: none; }
      }
    </style>
  </head>
  <body>
    <header class="page">
      <div class="brand" aria-label="Impulse Automotive">
        <span class="brand-name">IMPULSE</span>
        <span class="brand-line">AUTOMOTIVE</span>
      </div>
    </header>
    <main class="page">
      <div class="intro">
        <p class="eyebrow">Website showcase</p>
        <h1>The Impulse experience</h1>
        <p class="description">A customer journey, from first look to first enquiry.</p>
      </div>
      <figure class="player">
        <video controls playsinline preload="metadata" poster="/showcase/poster.jpg" aria-label="Impulse Automotive customer journey video">
          <source src="/showcase/impulse-customer-journey.mp4" type="video/mp4" />
          Your browser cannot play this video. <a href="/showcase/impulse-customer-journey.mp4" download>Download the video</a> to watch it.
        </video>
        <figcaption class="player-caption">
          <p class="format" aria-label="Video format: 48 seconds, 1080p, landscape">
            <span>48 seconds</span><span>1080p</span><span>Landscape</span>
          </p>
          <div class="actions">
            <a class="button" href="/showcase/impulse-customer-journey.mp4" download="impulse-customer-journey.mp4">
              Download video
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5" /></svg>
            </a>
            <a class="button button-secondary" href="https://impulse-opal.vercel.app/">
              View website
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12" /></svg>
            </a>
          </div>
        </figcaption>
      </figure>
    </main>
    <footer class="page">
      <p>Website demonstration using illustrative stock and pricing.</p>
    </footer>
  </body>
</html>
